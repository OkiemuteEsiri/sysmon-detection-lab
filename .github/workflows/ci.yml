name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI smoke test
        run: python -m src.cli data/synthetic_sysmon_events.json --output reports/ci-generated-assessment.md
      - name: Verify generated report
        run: test -s reports/ci-generated-assessment.md
